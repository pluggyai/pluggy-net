name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - master
env:
  PROJECT_PATH: 'Pluggy.SDK/Pluggy.SDK.csproj'
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_SECRET }}

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 6.0.x

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 19
          working_directory: ./Pluggy.SDK
          extra_plugins: |
            @semantic-release/commit-analyzer@9
            @semantic-release/release-notes-generator@10
            @semantic-release/github@8
            @semantic-release/git@10
            @semantic-release/exec@6
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNNER_DEBUG: 1
          
      - name: Pack project
        if: ${{ steps.release.outputs.new_release_version }}
        run: |
          dotnet clean
          dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --include-symbols --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

      - name: NuGet login
        if: ${{ steps.release.outputs.new_release_version }}
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        if: ${{ steps.release.outputs.new_release_version }}
        run: |
          dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source ${{ env.NUGET_SOURCE }} --skip-duplicate
