name: SDK Integration Tests

on:
  schedule:
    # Run daily at 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
        run: |
          set +e
          echo "🧪 Running integration tests..."
          dotnet test Pluggy.IntegrationTests/ --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed" --results-directory ./test-results
          test_exit_code=$?
          set -e
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f test-results/test-results.trx ]; then
            total=$(grep -o 'total="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "?")
            passed=$(grep -o 'passed="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "?")
            failed=$(grep -o 'failed="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "?")
            echo "📊 Test Results: $passed/$total passed, $failed failed"
            if [ "$failed" != "?" ] && [ "$failed" != "0" ]; then
              echo "❌ Some tests failed!"
            elif [ "$passed" != "?" ] && [ "$total" != "?" ] && [ "$passed" = "$total" ]; then
              echo "✅ All tests passed! ($passed/$total)"
            fi
          else
            echo "⚠️ Test results file not found"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit "$test_exit_code"

      - name: Display Test Results Summary
        if: always()
        run: |
          {
            echo "## Test Results Summary"
            if [ -f test-results/test-results.trx ]; then
              echo "✅ Test results file found: test-results/test-results.trx"
              total=$(grep -o 'total="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "unknown")
              passed=$(grep -o 'passed="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "unknown")
              failed=$(grep -o 'failed="[0-9]*"' test-results/test-results.trx | head -1 | grep -o '[0-9]*' || echo "unknown")
              echo "📊 **Total Tests:** $total"
              echo "✅ **Passed:** $passed"
              echo "❌ **Failed:** $failed"
              if [ "$failed" != "unknown" ] && [ "$failed" != "0" ]; then
                echo "⚠️ Some tests failed. Check the test output above for details."
              elif [ "$passed" != "unknown" ] && [ "$total" != "unknown" ] && [ "$passed" = "$total" ]; then
                echo "🎉 All tests passed! ($passed/$total)"
              fi
            else
              echo "⚠️ Test results file not found. Tests may have failed before completion."
              echo "Checking for any TRX files..."
              find . -name "*.trx" -type f 2>/dev/null | head -5 || echo "No TRX files found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: 'test-results/**/*.trx'
          if-no-files-found: warn
